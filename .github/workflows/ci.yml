name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. code style and common mistakes ----------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npm run lint

  # ---------- 2. type-check and build ----------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api # placeholder, real value is set in Vercel
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true # report only, do not block
      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # ---------- 3. click through the site in a real browser (fake API) ----------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium
      - name: Run the UI flow tests
        run: npm run test:e2e
      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # Deploying: Vercel's GitHub integration deploys every push by itself
  # (preview for pull requests, production for main). No extra step needed.
